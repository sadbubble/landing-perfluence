<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интернет және ТВ қосу — АО «Қазақтелеком»-ның ресми серіктесі</title>
    <meta name="description" content="Домашний интернет и телевидение от Казахтелекома. Оставьте заявку — подключим в удобное время." />
    <script>
      /*
       * Адрес папки без завершающего слэша (/perfluence вместо /perfluence/):
       * относительные пути к файлам отсчитались бы от корня сайта, и
       * страница осталась бы без стилей и скриптов.
       *
       * Не переадресуем, а подставляем <base> с папкой: адрес не меняется,
       * а ./assets/… ищутся в /perfluence/assets/…. Переадресация на «/»
       * была опасна: telecom.kz сам убирает слэш (301 /perfluence/ →
       * /perfluence), и страница перекидывалась бы по кругу бесконечно.
       *
       * Работает потому, что этот скрипт стоит в <head> раньше тегов сборки:
       * они разбираются уже с новой базой. Ссылок-якорей (#…) на странице
       * нет — с <base> они вели бы на другой адрес.
       */
      if (!/\/$/.test(location.pathname) && !/\.[a-z0-9]+$/i.test(location.pathname)) {
        const base = document.createElement("base");
        base.href = location.pathname + "/";
        document.head.appendChild(base);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
